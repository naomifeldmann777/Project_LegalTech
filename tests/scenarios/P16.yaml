# =============================================================================
# P16.yaml - test scenario P16: special termination grounds with a supported ground and a cure period (second part of handoff E7)
# -----------------------------------------------------------------------------
# Source: handoff App. E (E7: "Adding a positive period enables the clause but shows W_CURE").
# Expected result: NOT YET CONFIRMED by the law student (open item L11).
# =============================================================================

id: P16                                       # scenario ID, same as the file name
title: "Special grounds with a supported ground and a cure period"  # short description for the test report
answers:                                      # what differs from base_project.yaml
  termination_reasons: true                   # special grounds
  selected_termination_reasons: [client_material_nonpayment]  # one supported ground
  cure_period_days: 30                        # a positive period
expected:                                     # the result the engine must give
  can_generate: true                          # no error, "Generate" allowed
  clauses: [PRICE_FIXED, PAYMENT_ON_COMPLETION, TERMINATION_FOR_CAUSE]  # selected clauses, in contract order
  errors: []                                  # no errors
  warnings: [W_CONSUMER, W_CURE]              # E7: the number alone does not prove reasonableness
  contract_text_contains:                     # texts that must appear in the filled clauses
    - "the Client’s material failure to pay an amount properly due, subject to lawful payment defences."
    - "allow at least 30 calendar days after receipt to cure"
