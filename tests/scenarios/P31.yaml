  liability_limit: true                       # the narrow cap
  liability_cap_amount: "100000.00"           # CHF 100,000
expected:                                     # the result the engine must give
  can_generate: true                          # a warning does not block
  clauses: [PRICE_FIXED, PAYMENT_ON_COMPLETION, ACCEPTANCE_PROTOCOL, DEFECTS_STANDARD, LIABILITY_CAP, TERMINATION_LAW]  # selected clauses
